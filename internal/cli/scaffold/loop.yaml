# loop project. Only what "loop init" decided is written here; everything
# else uses the defaults. Every option is documented in
# https://github.com/christoph-jerolimov/loop/blob/main/docs/configuration.md,
# and "loop init --full" writes an annotated loop.yaml with all of them.
name: [[.Name]]

repo:
  url: [[.URL]]
[[if ne .Base "main"]]  base: [[.Base]]
[[end]]
# Backlog sources, in pick-up order. Items can depend on each other via
# "depends on: ..." lines.
sources:
  - name: backlog
    type: markdown           # backlog/*.md
    claim: true              # writes status: in-progress into the file
[[if .GitHub]]  - name: gh
    type: github
    labels: [ready-for-agent]   # only pick explicitly marked issues
    claim_label: loop:in-progress
[[end]][[if .GitLab]]  - name: gl
    type: gitlab
    labels: [ready-for-agent]
    claim_label: loop:in-progress
[[end]][[if .Jira]]  - name: jira
    type: jira
    url: https://my-org.atlassian.net
    jql: project = ABC AND labels = agent AND statusCategory != Done
    claim_label: loop-in-progress
    transitions:
      in_progress: In Progress
      done: Done
[[end]][[if .Prompts]]
prompts:
  session: prompts/session.md
  plan: prompts/plan.md
  self_review: prompts/self-review.md
  review: prompts/review.md
  ci: prompts/ci.md
  conflict: prompts/conflict.md
  verify: prompts/verify.md
[[end]][[if .Allow]]
agent:
  allow:                     # what a headless session may run besides the git defaults
[[range .Allow]]    - "[[.]]"
[[end]][[end]][[if .Test]]
steps:
  verify:                    # runs after every session; a failure starts a fix round
    - name: tests
      run: [[.Test]]
[[end]][[if .Prompts]]
pr:
  body: prompts/pr-body.md
[[end]]
workflow:
  merge: manual              # when-green | when-green-and-approved | auto-merge
